<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>halallegalpartner.id | Pendamping sertifikasi halal</title>
<meta name="description" content="Pendampingan sertifikasi halal dari UMKM sampai industri: SEHATI, reguler, SJPH, dan proses di SIHALAL.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFAF6; --surface:#F4EFE3; --ink:#14231C; --muted:#5B6A61; --line:#E6E0D1;
  --green:#105233; --green-d:#0B3D26; --on-green:#FCFAF6; --accent:#105233; --gold:#b8872c; --gold-d:#8a6226; --gold-l:#e5c179; --brand:#105233; --err:#B3261E;
  --ease:cubic-bezier(.22,.8,.24,1);
  --serif:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --gut:clamp(20px,5vw,56px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:only light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;transition:background .4s}
body.menu-open{overflow:hidden}
img,svg{max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.025em}
h1{font-size:clamp(2.4rem,5.6vw,4.6rem);line-height:1.06;letter-spacing:-.04em;font-weight:700}
h2{font-size:clamp(1.8rem,3.3vw,2.8rem);line-height:1.15;letter-spacing:-.035em}
h3{font-size:clamp(1.3rem,1.8vw,1.6rem);line-height:1.2;font-weight:500}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.wrap{width:min(1200px,100% - 2*var(--gut));margin-inline:auto}
.sec{padding-block:clamp(64px,9vw,128px)}
.sec-tight{padding-block:clamp(40px,6vw,72px)}
.lead{font-size:clamp(1.1rem,1.5vw,1.3rem);color:var(--muted);max-width:58ch;line-height:1.6}
.muted{color:var(--muted)}
.small{font-size:.92rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--green);color:var(--on-green);padding:.6rem 1rem;border-radius:8px;z-index:200}
.skip:focus{left:8px}
.ph{background:color-mix(in srgb,var(--gold-l) 35%,transparent);border-bottom:1px dashed var(--gold-d);border-radius:2px;padding:0 .15em}

/* buttons & links */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:.9rem 1.5rem;border-radius:999px;font:500 1rem/1.2 var(--sans);text-decoration:none;border:1px solid transparent;cursor:pointer;transition:background .3s,color .3s,border-color .3s,transform .35s var(--ease)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--green);color:var(--on-green)}
.btn-primary:hover{background:var(--green-d);transform:translateY(-2px)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:transparent}
.btn-ghost:hover{background:var(--surface);border-color:var(--muted);transform:translateY(-2px)}
.btn-light{background:var(--gold-l);color:var(--green-d)}
.btn-light:hover{transform:translateY(-2px);background:#F0D599}
.btn svg{width:18px;height:18px;flex:none}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.ulink{text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 30%,transparent);text-underline-offset:.3em;text-decoration-thickness:1px;transition:text-decoration-color .3s}
.ulink:hover{text-decoration-color:currentColor}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .35s,background .35s}
.hdr.scrolled,body.menu-open .hdr{border-bottom-color:var(--line)}
body.menu-open .hdr{background:var(--paper)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;height:68px;gap:24px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-size:1.6rem;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--brand)}
.brand svg{height:36px;width:auto;flex:none;transition:transform .6s var(--ease)}
.brand:hover svg{transform:translateY(-2px)}
.hl .h{fill:var(--hc,var(--green))}.hl .l{fill:var(--lc,var(--gold))}.hl .d{stroke:var(--lc,var(--gold))}
.brand span{color:var(--gold-d);font-weight:700}
.nav{display:none;gap:4px}
.nav a{position:relative;padding:.5rem .8rem;text-decoration:none;font-size:.98rem;color:var(--muted);transition:color .3s}
.nav a::after{content:"";position:absolute;left:.8rem;right:.8rem;bottom:2px;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink)}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1)}
.hdr-cta{display:none;padding:.6rem 1.15rem;font-size:.95rem}
.burger{width:44px;height:44px;border:0;background:transparent;cursor:pointer;position:relative;color:var(--ink)}
.burger i{position:absolute;left:11px;right:11px;height:1.5px;background:currentColor;transition:transform .45s var(--ease),top .45s var(--ease)}
.burger i:nth-child(1){top:18px}.burger i:nth-child(2){top:25px}
body.menu-open .burger i:nth-child(1){top:21.5px;transform:rotate(45deg)}
body.menu-open .burger i:nth-child(2){top:21.5px;transform:rotate(-45deg)}
@media(min-width:960px){.nav{display:flex}.hdr-cta{display:inline-flex}.burger{display:none}}

.menu{position:fixed;inset:0;z-index:50;background:var(--paper);padding:calc(92px + env(safe-area-inset-top,0px)) var(--gut) calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:space-between;visibility:hidden;opacity:0;transform:translateY(-12px);transition:opacity .4s,transform .5s var(--ease),visibility 0s .5s;overflow-y:auto}
body.menu-open .menu{visibility:visible;opacity:1;transform:none;transition:opacity .4s,transform .5s var(--ease),visibility 0s}
.menu nav{display:flex;flex-direction:column}
.menu nav a{font-family:var(--serif);font-weight:600;letter-spacing:-.035em;font-size:2rem;line-height:1.1;padding:.6rem 0;border-bottom:1px solid var(--line);text-decoration:none;opacity:0;transform:translateY(14px);transition:opacity .5s var(--ease),transform .5s var(--ease),padding .3s}
.menu nav a:hover{padding-left:10px}
body.menu-open .menu nav a{opacity:1;transform:none;transition-delay:calc(var(--n)*.05s + .1s)}
@media(min-width:960px){.menu{display:none}}

/* view transitions */
#view{transition:opacity .22s,transform .22s var(--ease)}
#view.swap{opacity:0;transform:translateY(8px)}
#view.enter>*{animation:enter .7s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#curtain{position:fixed;inset:0;z-index:90;background:var(--green);transform:translateY(100%);pointer-events:none;transition:transform .55s var(--ease);display:grid;place-items:center;color:var(--gold-l)}
#curtain svg{--hc:var(--on-green);--lc:var(--gold-l);height:84px;width:auto;opacity:0;transform:rotate(-45deg) scale(.8);transition:opacity .4s .15s,transform .7s var(--ease)}
#curtain.cover{transform:translateY(0);pointer-events:all}
#curtain.cover svg{opacity:1;transform:none}
#curtain.leave{transform:translateY(-100%)}
#curtain.reset{transition:none;transform:translateY(100%)}
.rv{opacity:0;transform:translateY(16px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

/* hero */
.hero{padding-block:clamp(36px,7vw,88px) clamp(48px,8vw,104px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(32px,6vw,96px);align-items:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:.4rem .9rem .4rem .6rem;border:1px solid var(--line);border-radius:999px;font-size:.9rem;color:var(--muted);margin-bottom:28px}
.badge svg{width:18px;height:18px;color:var(--gold)}
.hero h1{max-width:14ch;margin-bottom:28px}
.hero .lead{margin-bottom:36px}
.st>*{opacity:0;transform:translateY(18px);animation:rise .9s var(--ease) forwards;animation-delay:calc(var(--k)*.12s + .1s)}
@keyframes rise{to{opacity:1;transform:none}}
.motif{width:100%;max-width:460px;justify-self:end;color:var(--gold)}
.motif svg{width:100%;height:auto;display:block;overflow:visible}
.motif g{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
.motif .draw>*{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s var(--ease) forwards;animation-delay:calc(var(--i)*.14s + .3s)}
.motif .fillin{fill:currentColor;stroke:none;opacity:0;animation:fillin 1.6s 2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{opacity:.12}}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr}.motif{justify-self:start;max-width:320px}}

/* proof */
.proof{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line)}
.proof>div{padding:28px 24px;border-left:1px solid var(--line)}
.proof>div:first-child{border-left:0;padding-left:0}
.proof b{display:block;font:700 clamp(2rem,3.4vw,2.8rem)/1.05 var(--serif);letter-spacing:-.04em;color:var(--brand);margin-bottom:6px}
.proof span{color:var(--muted);font-size:.95rem;line-height:1.4;display:block;max-width:22ch}
@media(max-width:760px){.proof{grid-template-columns:1fr 1fr}.proof>div{border-left:0;padding:22px 0;border-top:1px solid var(--line)}.proof>div:nth-child(-n+2){border-top:0}.proof>div:nth-child(even){padding-left:20px;border-left:1px solid var(--line)}}

/* section head */
.shead{display:flex;flex-direction:column;gap:16px;margin-bottom:clamp(32px,5vw,56px);max-width:720px}

/* services (home) */
.svc{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto auto;gap:16px}
.panel{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;gap:14px;text-decoration:none;transition:border-color .35s,background .35s,transform .45s var(--ease)}
.panel:hover{background:var(--surface);border-color:var(--muted);transform:translateY(-3px)}
.panel p{color:var(--muted)}
.panel .more{margin-top:auto;padding-top:12px;font-weight:500}
.panel-green{background:var(--green);border-color:var(--green);color:var(--on-green);grid-row:span 2;min-height:420px}
.panel-green:hover{background:var(--green-d);border-color:var(--green-d)}
.panel-green p{color:color-mix(in srgb,var(--on-green) 82%,transparent);max-width:38ch}
.panel-green h3{font-size:clamp(1.8rem,3vw,2.5rem);font-weight:700;letter-spacing:-.035em}
.panel-green>*{position:relative;z-index:1}
.pat{position:absolute;inset:0;width:100%;height:100%;color:var(--gold-l);opacity:.22;pointer-events:none;-webkit-mask-image:linear-gradient(200deg,#000 0%,transparent 62%);mask-image:linear-gradient(200deg,#000 0%,transparent 62%);z-index:0!important;transition:opacity .6s,transform 1.2s var(--ease)}
.panel-green:hover .pat{opacity:.34;transform:scale(1.04)}
@media(max-width:860px){.svc{grid-template-columns:1fr}.panel-green{grid-row:auto;min-height:320px}}

/* why */
.why{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(32px,6vw,96px)}
.why-head{position:sticky;top:110px;align-self:start}
.why li{padding:28px 0;border-top:1px solid var(--line);display:grid;gap:8px;transition:padding .4s var(--ease)}
.why li:last-child{border-bottom:1px solid var(--line)}
.why li:hover{padding-left:12px}
.why li p{color:var(--muted);max-width:52ch}
@media(max-width:860px){.why{grid-template-columns:1fr}.why-head{position:static}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;counter-reset:s}
.steps li{position:relative;padding-top:64px}
.steps li::before{content:"";position:absolute;top:22px;left:54px;right:-24px;height:1px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .n{position:absolute;top:0;left:0;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);color:var(--brand);display:grid;place-items:center;font:600 1.05rem var(--serif);transition:background .4s,color .4s,border-color .4s}
.steps li:hover .n{background:var(--green);color:var(--gold-l);border-color:var(--green)}
.steps h3{margin-bottom:8px}
.steps p{color:var(--muted);font-size:.98rem}
@media(max-width:860px){.steps{grid-template-columns:1fr;gap:0}.steps li{padding:0 0 32px 64px;min-height:76px}.steps li::before{top:48px;left:22px;right:auto;width:1px;height:calc(100% - 48px)}}

/* sector rows */
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr) 40px;align-items:center;gap:20px;padding:26px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .45s var(--ease),background .35s}
.row h3{font-size:clamp(1.5rem,2.8vw,2.2rem);font-weight:600;transition:color .3s}
.row p{color:var(--muted);font-size:.98rem}
.row i{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);position:relative;transition:background .4s,border-color .4s,transform .5s var(--ease)}
.row i::before,.row i::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.5px;background:var(--ink);transform:translate(-50%,-50%);transition:background .3s}
.row i::after{transform:translate(-50%,-50%) rotate(90deg)}
.row:hover{padding-left:16px;background:var(--surface)}
.row:hover i{background:var(--green);border-color:var(--green);transform:rotate(90deg)}
.row:hover i::before,.row:hover i::after{background:var(--gold-l)}
@media(max-width:700px){.row{grid-template-columns:1fr 40px}.row p{grid-column:1;grid-row:2}.row i{grid-row:1/3;grid-column:2}}

/* testimonials */
.tt{display:grid;grid-template-columns:minmax(0,.35fr) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:start}
.tt-tabs{display:flex;flex-direction:column;gap:4px}
.tt-tabs button{font:500 1rem var(--sans);text-align:left;background:transparent;border:0;border-left:2px solid var(--line);padding:.7rem 1rem;color:var(--muted);cursor:pointer;transition:color .3s,border-color .3s,padding .4s var(--ease)}
.tt-tabs button:hover{color:var(--ink)}
.tt-tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--green);padding-left:1.4rem}
.tt-stage{display:grid}
.tt-stage>*{grid-area:1/1;margin:0;opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .5s,transform .6s var(--ease),visibility 0s .5s}
.tt-stage>*.on{opacity:1;visibility:visible;transform:none;transition:opacity .6s .1s,transform .7s .1s var(--ease),visibility 0s}
.tt-stage blockquote{margin:0 0 24px;font:500 clamp(1.5rem,2.7vw,2.2rem)/1.3 var(--serif);letter-spacing:-.03em}
.tt-stage figcaption{color:var(--muted);font-size:.98rem}
.tt-empty{min-height:190px;border-left:2px solid var(--gold);padding:8px 0 8px clamp(20px,3vw,40px);display:flex;flex-direction:column;justify-content:center;gap:10px}
.tt-empty strong{font:600 clamp(1.35rem,2vw,1.7rem)/1.25 var(--serif);letter-spacing:-.025em}
.tt-empty p{color:var(--muted);max-width:42ch}
@media(max-width:760px){.tt{grid-template-columns:1fr}.tt-tabs{flex-direction:row;overflow-x:auto}.tt-tabs button{border-left:0;border-bottom:2px solid var(--line);white-space:nowrap}.tt-tabs button[aria-selected="true"]{border-color:var(--green);padding-left:1rem}}

/* documentation gallery */
.doc-marquee{display:grid;gap:16px;overflow:hidden}
.doc-row{overflow:hidden}
.doc-track{display:flex;width:max-content;will-change:transform}
.doc-group{display:flex;flex:none;gap:16px;padding-right:16px}
.doc-row.right .doc-track{animation:doc-right 42s linear infinite}
.doc-row.left .doc-track{animation:doc-left 46s linear infinite}
.doc-row:hover .doc-track,.doc-row:focus-within .doc-track{animation-play-state:paused}
@keyframes doc-right{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes doc-left{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.doc-card{position:relative;display:block;flex:0 0 clamp(250px,31vw,390px);width:clamp(250px,31vw,390px);padding:0;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);text-align:left;cursor:zoom-in;transition:transform .4s var(--ease),border-color .3s}
.doc-card:hover{transform:translateY(-4px);border-color:var(--gold)}
.doc-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .65s var(--ease)}
.doc-card:hover img{transform:scale(1.025)}
.photo-viewer{width:min(92vw,1100px);max-width:none;max-height:92dvh;padding:12px;border:1px solid color-mix(in srgb,var(--gold) 42%,var(--line));border-radius:18px;background:var(--paper);color:var(--ink)}
.photo-viewer::backdrop{background:rgba(12,22,17,.82);backdrop-filter:blur(4px)}
.photo-viewer img{display:block;max-width:100%;max-height:calc(92dvh - 72px);margin:auto;object-fit:contain;border-radius:10px}
.photo-viewer form{display:flex;justify-content:flex-end;margin-bottom:8px}
.photo-viewer button{border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);padding:.45rem .9rem;font:500 .9rem var(--sans);cursor:pointer}
.photo-viewer p{padding:10px 4px 2px;color:var(--muted);font-size:.9rem}
@media(max-width:760px){.doc-marquee{gap:10px}.doc-group{gap:10px;padding-right:10px}.doc-card{flex-basis:76vw;width:76vw;border-radius:14px}}
@media(prefers-reduced-motion:reduce){.doc-row{overflow-x:auto;scrollbar-width:none}.doc-row::-webkit-scrollbar{display:none}.doc-track{animation:none!important}.doc-group[aria-hidden="true"]{display:none}}

/* CTA block */
.cta{position:relative;overflow:hidden;background:var(--green);color:var(--on-green);border-radius:28px;padding:clamp(36px,6vw,88px);display:grid;gap:28px;justify-items:start}
.cta>*{position:relative;z-index:1}
.cta h2{max-width:16ch}
.cta p{color:color-mix(in srgb,var(--on-green) 82%,transparent);max-width:46ch}
.cta .pat{color:var(--gold-l);-webkit-mask-image:linear-gradient(270deg,#000 0%,transparent 65%);mask-image:linear-gradient(270deg,#000 0%,transparent 65%);opacity:.2}

/* footer */
.ftr{border-top:1px solid var(--line);margin-top:clamp(40px,6vw,80px);padding-block:clamp(40px,6vw,72px) 32px}
.ftr-grid{display:grid;grid-template-columns:1.4fr 1fr 1.2fr 1fr;gap:32px}
.ftr h4{font:600 .95rem var(--sans);margin:0 0 14px}
.ftr li{margin-bottom:8px;color:var(--muted)}
.ftr li a{transition:color .3s}
.ftr li a:hover{color:var(--ink)}
.ftr .tag{font:600 1.2rem/1.35 var(--serif);letter-spacing:-.02em;max-width:24ch;margin-top:14px}
.disc{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;max-width:90ch}
.disc p+p{margin-top:8px}
@media(max-width:860px){.ftr-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.ftr-grid{grid-template-columns:1fr}}

/* WA float */
.wa{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;display:inline-flex;align-items:center;gap:10px;background:var(--green);color:var(--on-green);padding:.85rem 1.2rem;border-radius:999px;text-decoration:none;font-weight:500;font-size:.96rem;box-shadow:0 8px 28px -10px rgba(0,0,0,.45);opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .5s,transform .6s var(--ease),background .3s}
.wa.show{opacity:1;transform:none;pointer-events:auto}
.wa:hover{background:var(--green-d);transform:translateY(-3px)}
.wa svg{width:20px;height:20px;flex:none}
@media(max-width:560px){.wa span{display:none}.wa{padding:.95rem}}

/* inner pages */
.phead{padding-block:clamp(40px,7vw,96px) clamp(28px,4vw,48px);display:grid;gap:22px}
.phead h1{font-size:clamp(2.2rem,5vw,4.2rem);max-width:18ch}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border-radius:999px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}

function motif(){

        <div class="fields"><input class="fld" name="nama" autocomplete="name" placeholder="Nama Anda" aria-label="Nama Anda"><input class="fld" name="usaha" autocomplete="organization" placeholder="Nama usaha" aria-label="Nama usaha"></div><div class="err" role="alert">Isi nama dan nama usaha Anda.</div></fieldset>
      <fieldset class="q" data-need="jenis"><legend><i>2</i>Jenis usaha</legend>
        <div class="chips">${chip('jenis',['Kuliner UMKM','Resto/Katering','Dapur SPPG','RPU','Fashion','Bahan kimia','Lainnya'])}</div><div class="err" role="alert">Pilih jenis usaha Anda.</div></fieldset>
      <fieldset class="q" data-need="skala"><legend><i>3</i>Skala usaha</legend>
        <div class="chips">${chip('skala',['Mikro','Kecil','Menengah','Besar'])}</div><div class="err" role="alert">Pilih skala usaha Anda.</div></fieldset>
      <fieldset class="q" data-need="nib"><legend><i>4</i>Apakah sudah punya NIB?</legend>
        <div class="chips">${chip('nib',['Sudah','Belum','Sedang diurus'])}</div><div class="err" role="alert">Pilih salah satu jawaban.</div></fieldset>
      <fieldset class="q" data-need="hewani"><legend><i>5</i>Apakah produk mengandung daging atau turunan hewani?</legend>
        <div class="chips">${chip('hewani',['Ya','Tidak','Tidak yakin'])}</div><div class="err" role="alert">Pilih salah satu jawaban.</div></fieldset>
      <fieldset class="q" data-need="wa,kota"><legend><i>6</i>Nomor WhatsApp dan kota</legend>
        <div class="fields"><input class="fld" name="wa" type="tel" inputmode="tel" autocomplete="tel" placeholder="Nomor WhatsApp" aria-label="Nomor WhatsApp"><input class="fld" name="kota" autocomplete="address-level2" placeholder="Kota" aria-label="Kota"></div><div class="err" role="alert">Isi nomor WhatsApp dan kota Anda.</div></fieldset>
      <div><button class="btn btn-primary" type="submit">Kirim dan Dapatkan Rekomendasi</button></div>
    </form>
    <div class="done" id="done" tabindex="-1" aria-live="polite">
      <h2>Terima kasih.</h2>
      <p class="lead">Satu langkah lagi: kirim jawaban Anda lewat WhatsApp agar kami bisa menghubungi Anda dalam ${SITE.respon}.</p>
      <pre id="sum"></pre>
      <div class="btns"><a class="btn btn-primary" id="sendWa" href="#" target="_blank" rel="noopener">${ICON_WA}Kirim lewat WhatsApp</a><button class="btn btn-ghost" type="button" id="again">Isi ulang</button></div>
    </div>
  </div>
  <div class="info-w rv"><dl class="info">
    <div><dt>WhatsApp</dt><dd>${waShow()}</dd></div>
    <div><dt>Email</dt><dd>${mailto}</dd></div>
    <div><dt>Alamat</dt><dd>${SITE.alamat}</dd></div>
    <div><dt>Jam layanan</dt><dd>${SITE.jam}</dd></div>
  </dl>
  <div class="btns" style="margin-top:24px"><a class="btn btn-ghost" href="${wa()}" target="_blank" rel="noopener">${ICON_WA}Chat langsung</a></div></div>
</div></section>`;
}

function notFoundV(){return `<section class="wrap phead"><h1>Halaman tidak ditemukan</h1><p class="lead">Alamat yang Anda buka tidak ada atau sudah dipindahkan.</p><div><a class="btn btn-primary" href="#/">Kembali ke beranda</a></div></section>`}

const VIEWS={home:homeV,layanan:layananV,sektor:sektorV,portofolio:portofolioV,tentang:tentangV,faq:faqV,kontak:kontakV,blog:blogV};

/* ---- chrome ---- */
function buildChrome(){
 $('#brandMark').innerHTML=mark();
 $('#curtain').innerHTML=mark();
 $('#nav').innerHTML=NAV.map(n=>`<a href="#/${n[0]}" data-p="${n[0]}">${n[1]}</a>`).join('');
 $('#menuNav').innerHTML=[['','Beranda'],...NAV,['kontak','Cek Kelayakan & Kontak']].map((n,i)=>`<a href="#/${n[0]}" style="--n:${i}">${n[1]}</a>`).join('');
 $('#menuBtns').innerHTML=`<a class="btn btn-primary" href="${wa()}" target="_blank" rel="noopener" style="width:100%">${ICON_WA}Konsultasi Gratis via WhatsApp</a>`;
 const soc=Object.entries(SITE.social).map(([k,u])=>u?`<li><a class="ulink" href="${u}" target="_blank" rel="noopener">${k}</a></li>`:`<li>${k}</li>`).join('');
 const mail=/^\[/.test(SITE.email)?SITE.email:`<a class="ulink" href="mailto:${SITE.email}">${SITE.email}</a>`;
 $('#ftr').innerHTML=`<div class="wrap"><div class="ftr-grid">
  <div><a class="brand" href="#/">${mark()}</a><p class="tag">Pendamping sertifikasi halal, dari UMKM sampai industri.</p></div>
  <div><h4>Menu</h4><ul>${NAV.map(n=>`<li><a href="#/${n[0]}">${n[1]}</a></li>`).join('')}</ul></div>
  <div><h4>Kontak</h4><ul><li>${waShow()}</li><li>${mail}</li><li>${SITE.alamat}</li></ul></div>
  <div><h4>Media sosial</h4><ul>${soc}</ul></div>
 </div>
 <div class="disc"><p>halallegalpartner.id adalah layanan konsultasi dan pendampingan sertifikasi halal yang independen, bukan bagian dari BPJPH, LPH, maupun MUI. Keputusan penetapan kehalalan dan penerbitan sertifikat sepenuhnya merupakan kewenangan lembaga terkait. Program SEHATI dari pemerintah tidak dipungut biaya.</p><p>© 2026 halallegalpartner.id. Seluruh hak dilindungi.</p></div></div>`;
 const f=$('#waFloat'); f.href=wa(); f.innerHTML=ICON_WA+'<span>Tanya soal sertifikasi halal</span>';
 wrapPh($('#ftr')); wrapPh($('#menuBtns'));
}
function wrapPh(root){
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
 while(w.nextNode()){const n=w.currentNode;if(/\[[^\]]+\]/.test(n.nodeValue)&&!/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.tagName)&&!n.parentNode.classList.contains('ph'))nodes.push(n)}
 nodes.forEach(n=>{const fr=document.createDocumentFragment();
  n.nodeValue.split(/(\[[^\]]+\])/).forEach(p=>{if(/^\[[^\]]+\]$/.test(p)){const s=document.createElement('span');s.className='ph';s.textContent=p;fr.appendChild(s)}else if(p)fr.appendChild(document.createTextNode(p))});
  n.parentNode.replaceChild(fr,n)});
}

/* ---- router ---- */
const view=$('#view'),cur=$('#curtain');
let current=null,token=0,io=null;
const parse=()=>{const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);return{page:p[0]||'home',sub:p[1]||null}};

function render(r,soft){
 const f=VIEWS[r.page]||notFoundV;
 view.innerHTML=f(r); wrapPh(view);
 view.classList.remove('enter'); void view.offsetWidth; if(!soft)view.classList.add('enter');
 current=r;
 document.title=(TITLES[r.page]?TITLES[r.page]+' | ':'')+'halallegalpartner.id'+(r.page==='home'?'':'');
 $$('#nav a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.p===r.page)); $$('#nav a').forEach(a=>{if(a.dataset.p===r.page)a.setAttribute('aria-current','page')});
 observe();
}
function observe(){
 if(io)io.disconnect();
 const els=$$('.rv',view);
 if(reduce||!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px',threshold:.06});
 els.forEach(e=>io.observe(e));
}
async function navigate(first){
 const t=++token,r=parse();
 closeMenu();
 if(first||!current||reduce){render(r);if(!first)window.scrollTo(0,0);return}
 const soft=current.page===r.page&&(r.page==='layanan'||r.page==='sektor');
 if(soft){
  view.classList.add('swap');await sleep(230);if(t!==token)return;
  render(r,true);
  const a=$('[data-anchor]',view);if(a){const y=a.getBoundingClientRect().top+scrollY-96;if(scrollY>y)window.scrollTo(0,Math.max(0,y))}
  view.classList.remove('swap');return;
 }
 cur.classList.remove('leave','reset');cur.classList.add('cover');
 await sleep(580);if(t!==token)return;
 render(r);window.scrollTo(0,0);$('#main').focus({preventScroll:true});
 cur.classList.remove('cover');cur.classList.add('leave');
 await sleep(650);if(t!==token)return;
 cur.classList.add('reset');cur.classList.remove('leave');void cur.offsetWidth;cur.classList.remove('reset');
}
addEventListener('hashchange',()=>navigate(false));

/* ---- menu ---- */
function closeMenu(){document.body.classList.remove('menu-open');const b=$('#burger');b.setAttribute('aria-expanded','false');b.setAttribute('aria-label','Buka menu')}
$('#burger').addEventListener('click',()=>{const o=document.body.classList.toggle('menu-open');const b=$('#burger');b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Tutup menu':'Buka menu')});
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
$('#menu').addEventListener('click',e=>{if(e.target.closest('a[href^="#"]'))closeMenu()});
addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(a&&a.getAttribute('href')===location.hash)window.scrollTo({top:0,behavior:reduce?'auto':'smooth'})});

/* ---- scroll state ---- */
function onScroll(){const y=scrollY;$('#hdr').classList.toggle('scrolled',y>8);$('#waFloat').classList.toggle('show',y>280)}
addEventListener('scroll',onScroll,{passive:true});onScroll();

/* ---- interactions (delegated) ---- */
document.addEventListener('click',e=>{
 // documentation photo viewer
 const photo=e.target.closest('[data-photo]');
 if(photo){const dialog=$('#photoViewer');if(!dialog)return;const image=$('#photoViewerImage'),caption=$('#photoViewerCaption');image.src=photo.dataset.photo;image.alt=photo.querySelector('img')?.alt||'Foto dokumentasi';caption.textContent=photo.dataset.caption||'';dialog.showModal();return}
 // accordion
 const ac=e.target.closest('[data-acc]');
 if(ac){const item=ac.closest('.acc'),open=!item.classList.contains('open');
  $$('.acc.open').forEach(x=>{x.classList.remove('open');$('[data-acc]',x).setAttribute('aria-expanded','false')});
  if(open){item.classList.add('open');ac.setAttribute('aria-expanded','true')}return}
 // filters
 const fb=e.target.closest('[data-filter]');
 if(fb){const g=fb.closest('[data-fgroup]'),v=fb.dataset.filter;
  $$('[data-filter]',g).forEach(x=>x.setAttribute('aria-pressed',x===fb));
  $$('[data-c]',$(g.dataset.target)).forEach(it=>{
   const show=v==='all'||it.dataset.c===v;clearTimeout(it._t);
   if(show){it.hidden=false;void it.offsetWidth;it.classList.remove('out')}
   else{it.classList.add('out');it._t=setTimeout(()=>{it.hidden=true},reduce?0:290)}
  });return}
 // testimonials
 const tb=e.target.closest('[data-tt] [data-i]');
 if(tb){const w=tb.closest('[data-tt]'),i=+tb.dataset.i;
  $$('[data-i]',w).forEach(x=>x.setAttribute('aria-selected',x===tb));
  $$('.tt-stage > *',w).forEach((panel,k)=>panel.classList.toggle('on',k===i));return}
 // reset form
 if(e.target.closest('#again')){$('#done').classList.remove('on');const f=$('#cek');f.reset();f.style.display='';$$('.q',f).forEach(q=>q.classList.remove('bad'))}
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='cek')return;e.preventDefault();
 const f=e.target,d=Object.fromEntries(new FormData(f).entries());
 let ok=true,first=null;
 $$('.q',f).forEach(q=>{
  const bad=q.dataset.need.split(',').some(n=>!(d[n]||'').trim());
  q.classList.toggle('bad',bad);if(bad){ok=false;first=first||q}
 });
 if(!ok){first.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});const i=$('input',first);if(i&&i.type!=='radio')i.focus({preventScroll:true});return}
 const msg=`Halo halallegalpartner.id, saya ingin cek kelayakan sertifikasi halal.\nNama: ${d.nama}\nUsaha: ${d.usaha}\nJenis usaha: ${d.jenis}\nSkala: ${d.skala}\nNIB: ${d.nib}\nProduk mengandung daging/turunan hewani: ${d.hewani}\nWhatsApp: ${d.wa}\nKota: ${d.kota}`;
 $('#sum').textContent=msg;$('#sendWa').href=wa(msg);
 f.style.display='none';const done=$('#done');done.classList.add('on');wrapPh(done);
 done.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});done.focus({preventScroll:true});
});
document.addEventListener('input',e=>{const q=e.target.closest('.q.bad');if(q)q.classList.remove('bad')});

buildChrome();
navigate(true);
</script>
</body>
</html>
